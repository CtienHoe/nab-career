<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>香港學界籃球傳奇 - Hardwood Life HK</title>
<style>
  body { background-color: #1a1a24; color: #f0f0f0; font-family: "Microsoft JhengHei", sans-serif; padding: 20px; }
  #game-container { max-width: 600px; margin: 0 auto; background-color: #252530; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
  h1 { text-align: center; color: #f39c12; }
  .stats-board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; background: #111; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
  .stat-item { text-align: center; font-size: 14px; }
  .stat-value { font-size: 18px; font-weight: bold; color: #4CAF50; }
  .event-box { background: #333; padding: 20px; border-radius: 8px; margin-bottom: 20px; min-height: 120px; }
  .event-title { font-size: 20px; color: #3498db; margin-bottom: 10px; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  button { background-color: #e67e22; color: white; border: none; padding: 12px; font-size: 16px; border-radius: 5px; cursor: pointer; transition: 0.2s; }
  button:hover { background-color: #d35400; }
  #log { margin-top: 20px; padding: 10px; background: #000; font-size: 14px; height: 150px; overflow-y: scroll; border-radius: 5px; color: #aaa; }
  .log-entry { margin-bottom: 5px; border-bottom: 1px solid #333; padding-bottom: 5px; }
</style>
</head>
<body>

<div id="game-container">
  <h1>🏀 香港學界籃球傳奇</h1>
  
  <div class="stats-board" id="stats">
    <!-- Stats will be rendered here -->
  </div>

  <div class="event-box" id="event-box">
    <div class="event-title" id="event-title">歡迎來到精英賽</div>
    <div id="event-desc">你準備好帶領學校爭奪全港學界冠軍未？</div>
  </div>

  <div class="options" id="options">
    <button onclick="startGame()">開始籃球生涯</button>
  </div>

  <div id="log"></div>
</div>

<script>
// 初始屬性
let playerStats = {
  shooting: 10, defense: 10, pass: 10, athletic: 10, iq: 10, three: 10, fame: 0, morale: 50
};

// 狀態翻譯
const statNames = {
  shooting: "投籃", defense: "防守", pass: "傳球", athletic: "體能", iq: "球商", three: "三分", fame: "名氣", morale: "士氣"
};

// 輔助函數：計算隨機結果 (Low, Mid, High)
function tier(r) {
  if (r < 0.3) return 'low';
  if (r < 0.7) return 'mid';
  return 'high';
}

// 輔助函數：建立結果物件
function mk(msg, statsChange, hiddenChange = {}) {
  return { msg, statsChange: { ...statsChange, ...hiddenChange } };
}

// 香港化事件庫 (100% 根據你俾嘅邏輯轉換)
const hkEvents = [
  {
    t: "面對包夾防守", 
    x: "對手喺半場直接對你展開雙人包夾。",
    o: [
      {
        l: "用傳球破解包夾", i: "🏀", h: "衝組織",
        f: r => ({
          low: mk("隊友冇把握空檔", { pass: 1 }),
          mid: mk("成功串聯攻勢", { pass: 2, iq: 1 }),
          high: mk("傳球大師！將包夾撕成碎片", { pass: 3, iq: 2, fame: 3 })
        }[tier(r)])
      },
      {
        l: "強行單打挑戰", i: "🔥", h: "高風險",
        f: r => ({
          low: mk("失誤頻傳被打反擊", { shooting: -1, morale: -3 }),
          mid: mk("硬碰硬仍能取分", { shooting: 2 }),
          high: mk("無視防守，無解單打！", { shooting: 3, athletic: 1, fame: 5, morale: 3 })
        }[tier(r)])
      }
    ]
  },
  {
    t: "修頓主場嘅期待", 
    x: "修頓場館全場爆滿，全場球迷高喊你個名，氣氛沸騰！",
    o: [
      {
        l: "人來瘋！大騷特騷", i: "🎆", h: "衝熱度",
        f: r => ({
          low: mk("太想騷反而出洋相，炒粉收場", { fame: -2, morale: -3 }),
          mid: mk("精彩好球連發，引爆全場", { athletic: 1, fame: 5 }),
          high: mk("修頓戰神！全場陷入瘋狂", { shooting: 2, three: 1, fame: 10, morale: 5 })
        }[tier(r)])
      },
      {
        l: "穩紮穩打帶隊贏球", i: "🛡️", h: "衝球商",
        f: r => ({
          low: mk("表現平平，險勝對手", { iq: 1 }),
          mid: mk("冷靜指揮，順利取勝", { iq: 2, pass: 1 }),
          high: mk("成熟領袖風範，帶動全隊大勝", { iq: 2, defense: 1, morale: 4, fame: 2 })
        }[tier(r)])
      }
    ]
  },
  {
    t: "學界精英賽決賽 - 對戰拔萃", 
    x: "全港學界精英賽決賽，對手係衛冕冠軍拔萃男書院，最後十秒落後一分，球權喺你手上。",
    o: [
      {
        l: "自己操刀絕殺", i: "🎯", h: "大心臟",
        f: r => ({
          low: mk("絕殺炒粉，痛失冠軍...", { morale: -10, fame: -2 }),
          mid: mk("博到犯規，兩罰全中險勝！", { shooting: 2, iq: 1, fame: 5 }),
          high: mk("迎住防守 Step-back 三分絕殺！全港震驚！", { three: 3, fame: 15, morale: 10 })
        }[tier(r)])
      },
      {
        l: "吸引防守傳畀隊友", i: "🤝", h: "團隊至上",
        f: r => ({
          low: mk("隊友大空檔起手唔入...", { morale: -5, pass: 1 }),
          mid: mk("隊友上籃得手，反敗為勝！", { pass: 3, iq: 2, fame: 5 }),
          high: mk("完美助攻隊友入樽絕殺，登上學界之巔！", { pass: 4, iq: 3, fame: 8, morale: 8 })
        }[tier(r)])
      }
    ]
  }
];

function updateStatsUI() {
  const statsDiv = document.getElementById('stats');
  statsDiv.innerHTML = '';
  for (let key in playerStats) {
    statsDiv.innerHTML += `
      <div class="stat-item">
        <div>${statNames[key]}</div>
        <div class="stat-value">${playerStats[key]}</div>
      </div>
    `;
  }
}

function addLog(text) {
  const logDiv = document.getElementById('log');
  logDiv.innerHTML = `<div class="log-entry">${text}</div>` + logDiv.innerHTML;
}

function startGame() {
  playerStats = { shooting: 10, defense: 10, pass: 10, athletic: 10, iq: 10, three: 10, fame: 0, morale: 50 };
  updateStatsUI();
  addLog("籃球生涯正式展開！");
  nextEvent();
}

function nextEvent() {
  // 隨機抽一個事件
  const ev = hkEvents[Math.floor(Math.random() * hkEvents.length)];
  
  document.getElementById('event-title').innerText = ev.t;
  document.getElementById('event-desc').innerText = ev.x;
  
  const optionsDiv = document.getElementById('options');
  optionsDiv.innerHTML = '';
  
  ev.o.forEach((opt, index) => {
    const btn = document.createElement('button');
    btn.innerText = `${opt.i} ${opt.l} (${opt.h})`;
    btn.onclick = () => handleOption(opt);
    optionsDiv.appendChild(btn);
  });
}

function handleOption(opt) {
  const r = Math.random(); // 0.0 到 1.0 之間
  const result = opt.f(r);
  
  // 更新屬性
  let changeText = "";
  for (let key in result.statsChange) {
    playerStats[key] += result.statsChange[key];
    let sign = result.statsChange[key] > 0 ? "+" : "";
    changeText += ` ${statNames[key]}${sign}${result.statsChange[key]}`;
  }
  
  // 顯示結果
  addLog(`> 你選擇咗：${opt.l}`);
  addLog(`結果：${result.msg} (${changeText})`);
  
  updateStatsUI();
  
  // 準備下一個事件
  document.getElementById('options').innerHTML = '<button onclick="nextEvent()">繼續下一場比賽</button>';
}

// 初始化 UI
updateStatsUI();
</script>
</body>
</html>
